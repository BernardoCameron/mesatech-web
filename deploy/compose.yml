# EC2 ep2-web: nginx (443) + front + BFF.
# Estructura esperada en la EC2:  ~/mesatech-web  y  ~/mesatech-backend  (clonados lado a lado)
# Uso (dentro de mesatech-web/deploy):  cp .env.example .env  y  docker compose up -d --build
services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Origin Certificate de Cloudflare (no se sube al repo)
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - web
      - bff

  web:
    build:
      context: ..
      args:
        # El front llama a la API por el API Gateway (que reenvia al BFF)
        NEXT_PUBLIC_API_URL: ${API_URL}
        NEXT_PUBLIC_AUTH: entra
        NEXT_PUBLIC_AZURE_TENANT_ID: ${AZURE_TENANT_ID}
        NEXT_PUBLIC_AZURE_WEB_CLIENT_ID: ${AZURE_WEB_CLIENT_ID}
        NEXT_PUBLIC_API_SCOPE: ${API_SCOPE}
        NEXT_PUBLIC_REDIRECT_URI: https://${DOMINIO_WEB}
    restart: unless-stopped

  bff:
    build: ../../mesatech-backend/bff
    restart: unless-stopped
    environment:
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      AZURE_API_CLIENT_ID: ${AZURE_API_CLIENT_ID}
      # IP privada de las EC2 de los microservicios
      MS_SOLICITUDES_URL: http://${IP_SOLICITUDES}:8081
      MS_CATALOGO_URL: http://${IP_CATALOGO}:8082
      CORS_ALLOWED_ORIGINS: https://${DOMINIO_WEB}
