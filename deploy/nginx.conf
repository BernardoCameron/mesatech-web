# Cloudflare termina el HTTPS del visitante y vuelve a cifrar hacia aqui (SSL Full strict)
server {
    listen 443 ssl;
    server_name mesatech.bcameron.dev;

    ssl_certificate     /etc/nginx/certs/origen.pem;
    ssl_certificate_key /etc/nginx/certs/origen.key;

    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 443 ssl;
    server_name mesatech-api.bcameron.dev;

    ssl_certificate     /etc/nginx/certs/origen.pem;
    ssl_certificate_key /etc/nginx/certs/origen.key;

    location / {
        proxy_pass http://bff:8080;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-Proto https;
    }
}
